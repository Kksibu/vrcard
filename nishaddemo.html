<style>
  :root{
    --navy:#0B2A4A;
    --blue:#1565C0;
    --paper:#F4F7FA;
    --whatsapp:#25D366;
    --ink:#1A1A1A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', Arial, sans-serif;
    padding:24px 16px;
  }
  .card-wrap{
    width:100%;
    max-width:420px;
  }
  .card-img{
    width:100%;
    border-radius:12px;
    box-shadow:0 8px 24px rgba(11,42,74,0.18);
    display:block;
  }
  .name-block{
    text-align:center;
    margin-top:22px;
  }
  .name-block h1{
    font-size:22px;
    color:var(--navy);
    font-weight:700;
  }
  .name-block p{
    font-size:14px;
    color:#5A6B7A;
    margin-top:4px;
  }
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:24px;
  }
  .actions a{
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 10px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    color:#fff;
  }
  .call{ background:var(--navy); }
  .whatsapp{ background:var(--whatsapp); }
  .email{ background:var(--blue); }
  .website{ background:#37474F; }
  .actions a svg{ width:18px; height:18px; fill:#fff; flex-shrink:0; }

  .full-width{ grid-column: span 2; }

  .footer{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    color:#8A97A3;
  }
</style>
